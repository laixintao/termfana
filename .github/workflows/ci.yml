name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install test tools
        run: python -m pip install -r scripts/requirements-ci.txt
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Race tests, vet, and version consistency
        run: make check
      - name: Release automation tests
        run: make release-test
      - name: Build and exercise a real terminal
        run: make smoke
      - name: Verify binary version
        run: test "$(./bin/termfana --version)" = "$(python3 scripts/version.py)"
